function renderGuide(c,s){if(!s){let img=c==="Japan"?"japan-local-guide-locked.jpeg":"seoul-local-guide-locked.png";app.innerHTML=`${top(c+" · Local Guide","Useful information inside the app; official/current resources supplement it.")}<img class="hero" src="${img}"><div class="section">${["At a Glance","Getting Around","Convenience Stores","Attractions","Safety","Quick Reference"].map(x=>card(x,x==="Safety"?"Emergency · alerts · evacuation · embassies":"Open in-app guide",`guide?c=${c}&s=${encodeURIComponent(x)}`)).join("")}</div>`;return}if(s==="Safety"){renderSafety(c);return}app.innerHTML=`${top(s,c+" Local Guide")}${accord(guide[c][s]||[])}${s==="Attractions"?`<div class="section"><h2>Explore current information</h2><button class="btn" onclick="window.open('${map((c==="Japan"?"Japan":"Seoul")+" attractions")}','_blank')">Current map & hours</button></div>`:""}`}
function renderSafety(c){let japan=c==="Japan",cities=japan?["Osaka","Kyoto","Uji","Nara","Fujiyoshida / Kawaguchiko","Tokyo","Kamakura"]:["Seoul"];app.innerHTML=`${top(c+" · Safety & Disaster","Interactive emergency reference. Use official current alerts for live conditions.")}<div class="grid"><button class="card danger" onclick="location.href='tel:${japan?"110":"112"}'"><h3>Police · ${japan?"110":"112"}</h3><div class="sub">Tap to call</div></button><button class="card danger" onclick="location.href='tel:119'"><h3>Fire / Ambulance · 119</h3><div class="sub">Tap to call</div></button></div><div class="section"><h2>Live / current official resources</h2>${japan?`<button class="btn" onclick="window.open('https://www.jma.go.jp/bosai/','_blank')">JMA warnings ↗</button> <button class="btn" onclick="window.open('https://www.japan.travel/en/plan/emergencies/','_blank')">JNTO emergencies ↗</button>`:`<button class="btn" onclick="window.open('https://eng.safekorea.go.kr/safekorea-eng/flsm/flsm/facilitiesSafteyMap.do?menuSn=1001&title=Civil+Defense+Shelter','_blank')">Korea Safety Map ↗</button>`}<div class="status" style="margin-top:8px">These buttons open current official sources; the app does not label cached text as live.</div></div><div class="section"><h2>Evacuation & Shelter</h2><select class="search" id="safeCity">${cities.map(x=>`<option>${esc(x)}</option>`).join("")}</select><button class="btn primary" onclick="window.open('${map("official evacuation shelter")} '+encodeURIComponent($('#safeCity').value),'_blank')">Find current evacuation information</button><p class="sub">Use the shelter appropriate to the hazard and your actual location. Do not assume one shelter is correct for every emergency.</p></div><div class="section"><h2>What To Do</h2>${accord(japan?[["Earthquake","Protect your head, stay away from glass, wait for strong shaking to stop, then follow staff and official alerts."],["Tsunami","In a coastal risk area after strong/long shaking or an official warning, move promptly to higher ground or a designated tsunami evacuation location."],["Typhoon / flood","Check official warnings before travel. Avoid rivers, underpasses and flooded roads; follow municipal evacuation instructions."],["Hotel / station / underground","Follow staff and posted evacuation routes. In fire use stairs, not elevators; avoid crowding exits."]]:[["Earthquake","Protect your head and follow building/station staff. Check official alerts after shaking."],["Heavy rain / flood","Avoid flooded roads, streams and low underpasses. Follow emergency alerts and shelter instructions."],["Civil defence alert","Follow official mobile alerts and local instructions; use the government safety map for current shelter information."],["Hotel / subway","Follow staff and posted evacuation routes. In fire use stairs, not elevators."]])}</div><div class="section"><h2>Embassy Help</h2>${emb[c].map(e=>`<div class="card"><h3>${esc(e[0])}</h3><p class="sub">${esc(e[2])}<br>${esc(e[1])}</p><button class="btn" onclick="window.open('${map(e[2])}','_blank')">Map</button> <button class="btn" onclick="window.open('${e[3]}','_blank')">Official site</button></div>`).join("")}</div>`}
function renderBookings(){app.innerHTML=`${top("Bookings & Travel Info","Only non-sensitive trip arrangements. No identity, insurance, health or banking records.")}<div class="section"><h2>Confirmed / known tickets</h2>${D.bookings.map(x=>`<div class="card"><div class="status">${esc(x[0])} · ${esc(x[3])}</div><h3>${esc(x[1])}</h3><p class="sub">${esc(x[2])}</p></div>`).join("")}</div><div class="section"><h2>Travel setup</h2>${card("Accommodation","Osaka · Kyoto · Fuji · Tokyo · Seoul","journey")}${card("Luggage Services","Kyoto → Tokyo forwarding plan; keep Fuji overnight essentials with you","luggage")}${card("Travel Documents","Keep only non-sensitive tickets/confirmations offline","documents")}${card("Connectivity Setup","eSIM · offline maps · charging","connectivity")}</div>`}
function renderSimple(name){let text={packing:"Weather, checklist, by-city packing, luggage and essentials. Keep the approved Packing & Weather concept here.",luggage:"For Kyoto → Fuji → Tokyo, forwarding the large suitcases to Tokyo can reduce transfer-day carrying. Keep valuables, chargers and overnight essentials with you.",documents:"Store only non-sensitive tickets and booking confirmations. Do not put identity, health, banking or other sensitive records in the repository.",connectivity:"Prepare eSIM/data, offline maps, chargers and a power bank before departure.",ready:"Readiness should cover booking checks, packing and non-sensitive trip preparation—not identity documents."}[name]||"";app.innerHTML=`${top(name[0].toUpperCase()+name.slice(1).replace("-"," "),text)}`}
function wallet(){let w=JSON.parse(localStorage.getItem("ss.wallet")||'{"transactions":[],"cash":{"JPY":0,"KRW":0},"cashLoads":[]}');return w}function saveWallet(w){localStorage.setItem("ss.wallet",JSON.stringify(w))}
const cats=["Hotels","Flights","Local Transportation","Attractions","Shopping","Food"];
function renderWallet(q){let w=wallet(),c=q.c||"All",rows=c==="All"?w.transactions:w.transactions.filter(x=>x.country===c),actual=rows.reduce((s,x)=>s+(+x.actualCad||0),0),est=rows.reduce((s,x)=>s+(!x.actualCad?(+x.estimatedCad||0):0),0),by=Object.fromEntries(cats.map(k=>[k,rows.filter(x=>x.category===k).reduce((s,x)=>s+(+x.actualCad||+x.estimatedCad||0),0)])),mx=Math.max(1,...Object.values(by));app.innerHTML=`${top(c==="All"?"Travel Wallet":c+" Cash & Expenses","One private local wallet; country pages are filtered views.")}<div class="grid"><div class="card"><div class="metric">C$${(actual+est).toFixed(2)}</div><div class="sub">Total · C$${actual.toFixed(2)} actual + C$${est.toFixed(2)} estimated</div></div><div class="card"><div class="metric">¥${(+w.cash.JPY||0).toLocaleString()} / ₩${(+w.cash.KRW||0).toLocaleString()}</div><div class="sub">Physical cash remaining</div></div></div><div class="chips"><button class="chip" onclick="go('wallet')">Whole Trip</button><button class="chip" onclick="go('wallet?c=Japan')">Japan</button><button class="chip" onclick="go('wallet?c=South Korea')">Korea</button></div><div class="section"><h2>Spending by category</h2><div class="card bars">${cats.map(k=>`<div><div class="row"><span>${k}</span><b>C$${by[k].toFixed(2)}</b></div><div class="bar"><i style="width:${by[k]/mx*100}%"></i></div></div>`).join("")}</div></div><div class="section"><h2>Transactions</h2>${rows.map(x=>`<div class="card"><div class="status">${esc(x.date)} · ${esc(x.country)} · ${esc(x.category)}</div><h3>${esc(x.note||x.description||x.id)}</h3><div class="row"><span>${esc(x.currency)} ${Number(x.amount).toLocaleString()}</span><b>${x.actualCad?`C$${Number(x.actualCad).toFixed(2)}`:x.estimatedCad?`~C$${Number(x.estimatedCad).toFixed(2)}`:"CAD pending"}</b></div></div>`).join("")||`<div class="empty">No wallet entries on this device yet. Import the private wallet file once.</div>`}</div><div class="section"><h2>Wallet tools</h2><input type="file" id="walletFile" accept=".json" style="display:none" onchange="importWallet(this)"><button class="btn primary" onclick="$('#walletFile').click()">Import private wallet</button> <button class="btn" onclick="exportWallet()">Export backup</button> <button class="btn" onclick="addCash()">Add Cash</button><p class="privacy">Wallet data stays in this browser's local storage. The public repository contains no private transaction ledger.</p></div>`}
function importWallet(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result),w=j.wallet||j;if(!Array.isArray(w.transactions))throw 0;saveWallet(w);render()}catch(e){alert("That file is not a valid wallet backup.")}};r.readAsText(f)}
function exportWallet(){let b=new Blob([JSON.stringify({wallet:wallet(),exportedAt:new Date().toISOString()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Sakura_Seoul_Wallet_Backup.json";a.click()}
function addCash(){let cur=prompt("Currency: JPY or KRW","JPY");if(!["JPY","KRW"].includes(cur))return;let n=Number(prompt("Amount to add","0"));if(!(n>0))return;let w=wallet();w.cash[cur]=(+w.cash[cur]||0)+n;w.cashLoads.push({date:new Date().toISOString().slice(0,10),currency:cur,amount:n});saveWallet(w);render()}
function renderWeather(c){app.innerHTML=`${top(c+" · Weather","Use current forecasts close to the trip; do not treat old text as live weather.")}<button class="btn primary" onclick="window.open('${map(c==="Japan"?"Japan weather forecast":"Seoul weather forecast")}','_blank')">Open current forecast</button>`}
function renderCities(c){let cities=c==="Japan"?["Osaka","Kyoto","Uji","Nara","Fuji / Kawaguchiko","Tokyo","Kamakura"]:["Seoul"];app.innerHTML=`${top(c+" · Cities","Trip locations")}<div class="section">${cities.map(x=>card(x,"Food · shopping · map",`food?c=${c}&city=${encodeURIComponent(x)}`)).join("")}</div>`}
function render(){
let [b,q]=qs();
if(b==="home")renderHome();else if(b==="country")renderCountry(q.c);else if(b==="journey")renderJourney();else if(b==="today")renderToday(q.c);else if(b==="food")renderFood(q);else if(b==="shopping")renderShopping(q);else if(b==="guide")renderGuide(q.c,q.s);else if(b==="wallet")renderWallet(q);else if(b==="bookings")renderBookings();else if(b==="weather")renderWeather(q.c);else if(b==="cities")renderCities(q.c);else if(["packing","luggage","documents","connectivity","ready"].includes(b))renderSimple(b);else renderHome()}
window.addEventListener("hashchange",render);render();
