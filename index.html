<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Sakura & Seoul Journal</title>
<style>
:root{--bg:#f7f1e8;--card:#fffdf9;--ink:#332d29;--muted:#756d67;--line:#e5d8cb;--rose:#d7a39e;--sage:#a7b5a1;--shadow:0 8px 26px rgba(72,54,43,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"DM Sans",sans-serif}button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 94px}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{border:0;background:transparent;font-size:24px;width:34px;height:34px}.brand{font-family:Georgia,serif;font-size:14px}.hero{width:100%;border-radius:22px;display:block;box-shadow:var(--shadow);max-height:330px;object-fit:cover}.title{font-family:Georgia,serif;font-size:30px;margin:18px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.tile,.card{background:var(--card);border:1px solid rgba(0,0,0,.03);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.tile{padding:0;text-align:left}.tile img{width:100%;height:116px;object-fit:cover;display:block}.tile .txt{padding:12px}.tile b,.card h3{font-family:Georgia,serif}.tile small{display:block;color:var(--muted);margin-top:3px}.card{padding:16px;margin:10px 0}.section{margin-top:22px}.section h2{font-family:Georgia,serif;font-size:20px;margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px}.primary{background:#4c4844;color:white;border-color:#4c4844}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#f1e6db;font-size:10px;margin:2px}.good{background:#e4efe1}.warn{background:#fff0c9}.rec{border-left:4px solid var(--sage)}.saved{border-left:4px solid var(--rose)}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;padding:10px 2px 18px;font-size:11px;color:#6c655f}.nav b{display:block;font-size:18px}.accordion{width:100%;text-align:left;border:0;background:var(--card);border-radius:17px;padding:15px;margin:7px 0;box-shadow:var(--shadow)}.panel{display:none;padding:4px 12px 12px;color:#5e5752;font-size:13px;line-height:1.55}.panel.open{display:block}.metric{font-family:Georgia,serif;font-size:24px}.bars{display:grid;gap:8px}.bar{height:10px;background:#eadfd4;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#9a8f85}.privacy{font-size:11px;color:var(--muted);line-height:1.5}.danger{background:#fff3ef}.status{font-size:10px;color:var(--muted)}a{color:inherit}.empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:420px){.title{font-size:27px}.tile img{height:105px}}
</style></head><body><main class="app" id="app">
<div class="top"><div class="brand">The Sakura &amp; Seoul Journal</div></div>
<h1 class="title">The Sakura &amp; Seoul Journal</h1>
<p class="sub">Oct 6–25, 2026 · Japan + South Korea</p>
<div class="section"><h2>Trip Readiness &amp; Bookings</h2>
<button class="card row" style="width:100%;text-align:left" onclick="location.hash='#bookings'"><div><h3 style="margin:0">Bookings &amp; Travel Info</h3><div class="sub">Accommodation · flights &amp; tickets · luggage · confirmations · connectivity</div></div><b>›</b></button>
<button class="card row" style="width:100%;text-align:left" onclick="location.hash='#packing'"><div><h3 style="margin:0">Packing &amp; Weather</h3><div class="sub">Weather · checklist · by city · luggage · essentials</div></div><b>›</b></button>
</div>
<div class="section"><h2>Our Journey</h2><div class="grid">
<button class="tile" onclick="location.hash='#country?c=Japan'"><img src="japan-kamakura-hero-v24.png" alt="Japan"><div class="txt"><b>Japan</b><small>Osaka · Kyoto · Uji · Fuji · Tokyo · Oct 7–21</small></div></button>
<button class="tile" onclick="location.hash='#country?c=South%20Korea'"><img src="korea-seoul-hero-v24.png" alt="South Korea"><div class="txt"><b>South Korea</b><small>Seoul · Oct 21–25</small></div></button>
</div></div>
<noscript><div class="card danger"><h3>JavaScript is disabled</h3><p class="sub">Enable JavaScript to use the interactive journal.</p></div></noscript>
</main><nav class="nav"><div class="navin">
<button onclick="go('home')"><b>⌂</b>Home</button><button onclick="go('journey')"><b>⌁</b>Journey</button><button onclick="go('food')"><b>♨</b>Food</button><button onclick="go('wallet')"><b>¥</b>Wallet</button><button onclick="go('ready')"><b>✓</b>Ready</button>
</div></nav>
<script src="app.js" defer></script></body></html>
